version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comp_docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comp_docs}
      POSTGRES_DB: ${POSTGRES_DB:-comp_docs}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    command: npm run start:dev
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - ./storage/uploads:/app/storage/uploads
      - ./storage/reports:/app/storage/reports
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    command: npm run dev
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  frontend-node-modules:
  backend-node-modules:
